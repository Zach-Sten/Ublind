[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ublind"
version = "0.1.0"
description = "Exploring high-dimensional data with sound"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zachary Stensland" }]
maintainers = [{ name = "Zachary Stensland", email = "zach.stensland@ucsf.edu" }]
keywords = ["sonification", "embeddings", "umap", "pca", "music", "midi", "anndata"]
dependencies = ["numpy>=1.24", "anndata>=0.9", "matplotlib>=3.5"]

[project.optional-dependencies]
scanpy = ["scanpy>=1.9"]
fluidsynth = ["pyfluidsynth>=1.3"]
all = ["scanpy>=1.9", "pyfluidsynth>=1.3", "imageio>=2.30"]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ublind = ["pl/html/*.html"]
